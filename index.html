<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <title>Opera Type</title>
  </head>
  <body>
    <main class="app">
      <div class="stage" id="stage">
        <input class="word" id="word" type="text" aria-label="Word" placeholder="Type a word" spellcheck="false" autocomplete="off" autocapitalize="characters" />
      </div>

      <aside class="panel">
        <div class="logo" id="logo" role="img" aria-label="Opera"></div>

        <div class="grid cols-2" role="tablist" aria-label="Tool">
          <button class="tile" role="tab" data-tool-tab="stretch">Stretch</button>
          <button class="tile" role="tab" data-tool-tab="stave">Stave</button>
        </div>

        <section>
          <h2>Font</h2>
          <div class="grid font-row">
            <select class="tile select" id="font-select" aria-label="Font"></select>
            <button class="tile" id="font-upload">Upload</button>
            <input type="file" id="font-file" accept=".otf,.ttf,.woff" hidden />
          </div>
          <div class="sliders" id="font-axes"></div>
          <button class="tile toggle" id="auto-weight" aria-pressed="false" hidden>Bolder when stretched</button>
          <p class="note" id="axes-note" hidden>This font has a single style</p>
          <div class="sliders" id="stroke-slider"></div>
        </section>

        <div class="tool" data-tool="stretch">
        <section>
          <h2>Baseline</h2>
          <div class="grid cols-2">
            <button class="tile" data-baseline="bottom">Bottom</button>
            <button class="tile" data-baseline="top">Top</button>
          </div>
        </section>

        <section>
          <h2>Modulate Height</h2>
          <div class="grid cols-3" id="height-modes"></div>
          <div class="sliders" id="height-sliders"></div>
        </section>

        <section>
          <h2>Modulate Italic</h2>
          <div class="grid cols-4" id="italic-modes"></div>
          <div class="sliders" id="italic-sliders"></div>
        </section>

        <section>
          <h2>Quick Actions</h2>
          <div class="grid">
            <button class="tile" id="randomize-all">Randomize Everything</button>
            <button class="tile" id="randomize-height">Randomize Height</button>
            <button class="tile" id="reset">Reset Selection</button>
          </div>
        </section>
        </div>

        <div class="tool" data-tool="stave" hidden>
          <section>
            <h2>Melody</h2>
            <div class="grid cols-4" id="stave-melody"></div>
            <div class="sliders" id="stave-melody-sliders"></div>
          </section>

          <section>
            <h2>Rhythm</h2>
            <div class="sliders" id="stave-rhythm"></div>
          </section>

          <section>
            <h2>Motion</h2>
            <div class="sliders" id="stave-motion"></div>
          </section>

          <section>
            <div class="section-head">
              <h2>Warp</h2>
              <button class="switch" id="warp-switch" role="switch" aria-checked="false" aria-label="Warp"></button>
            </div>
            <div class="sliders" id="stave-warp"></div>
            <p class="note" id="shape-note" hidden>While paused, drag a letter's top or bottom to stretch it, or its middle to move it</p>
          </section>

          <section>
            <h2>Animate Height</h2>
            <div class="grid cols-4" id="loop-modes"></div>
            <div class="sliders" id="loop-sliders"></div>
          </section>

          <section>
            <h2>Stave</h2>
            <div class="sliders" id="stave-layout"></div>
            <button class="tile toggle" id="stave-lines" aria-pressed="true">Stave Lines</button>
          </section>

          <section>
            <h2>Quick Actions</h2>
            <div class="grid cols-2">
              <button class="tile" id="stave-new">New Melody</button>
              <button class="tile" id="stave-play">Play</button>
              <button class="tile" id="stave-reset">Reset</button>
              <button class="tile" id="stave-svg">Save SVG</button>
            </div>
          </section>
        </div>

        <footer class="hint" id="hint" role="status">⌘S to save PNG</footer>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
